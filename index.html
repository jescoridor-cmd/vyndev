<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vyn Novel Space · v1.0.3</title>
<style>
:root{--bg:#11121a;--panel:#1a1b25;--panel2:#222331;--line:#343447;--text:#eee9f2;--muted:#a7a1b4;--gold:#d7ad82;--gold2:#f0d3ad;--accent:#9b78d4;--reader:#f2e8d6;--readerText:#3c3028}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:10px;transition:.2s}button:hover{border-color:var(--gold);transform:translateY(-1px)}button.primary{background:linear-gradient(120deg,#c69c76,#e4c49e);color:#211a18;border:0;font-weight:700}button.ghost{background:transparent}.app{display:flex;min-height:100vh}.sidebar{width:220px;flex-shrink:0;background:#15151f;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{padding:8px 10px 24px;font-family:Georgia,serif;color:var(--gold2);font-size:23px}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:4px}.nav{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:transparent;border-color:transparent;color:#c9c4d1}.nav.active{background:#292637;border-color:#383347;color:#fff}.sidebar .bottom{margin-top:auto}.main{flex:1;min-width:0;padding:28px clamp(14px,3vw,42px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.eyebrow{color:var(--gold);letter-spacing:1.8px;font-size:11px;text-transform:uppercase}.h1{font:clamp(25px,3vw,38px) Georgia,serif;margin:5px 0 8px}.muted{color:var(--muted)}.hero{border:1px solid #373347;border-radius:20px;padding:28px;background:linear-gradient(110deg,#242132,#171722);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:8%;top:5%;font-size:140px;color:#77608e;opacity:.13}.hero p{max-width:520px;color:#c5bfce}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font:24px Georgia,serif;display:block;margin:6px 0;color:var(--gold2)}.stat small{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h2{font:22px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.book{overflow:hidden;padding:0}.cover{height:160px;background:linear-gradient(140deg,#403450,#1a1c2b);display:flex;align-items:center;justify-content:center;font:25px Georgia,serif;text-align:center;padding:15px;color:#ead3b2;background-size:cover;background-position:center}.bookbody{padding:14px}.book h3{margin:0 0 5px;font:19px Georgia,serif}.book-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.book-actions button{font-size:12px;padding:7px 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;padding:11px;background:#12131b;border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}.field:focus{border-color:var(--gold)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.modalback{position:fixed;inset:0;background:#05050bbd;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#1b1b25;border:1px solid var(--line);border-radius:18px;padding:22px}.modal h2{font:25px Georgia,serif;margin:0 0 16px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.editor{display:grid;grid-template-columns:210px minmax(0,1fr) 190px;gap:12px;height:calc(100vh - 155px);min-height:460px}.editorpanel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:auto;padding:12px}.chapteritem{padding:9px;border-radius:8px;cursor:pointer;color:#c6c0cf;margin-bottom:4px}.chapteritem.active{background:#302a3c;color:var(--gold2)}.editarea{width:100%;min-height:320px;resize:vertical;background:transparent;border:0;color:var(--text);outline:none;font:18px/1.8 Georgia,serif;padding:14px}.edithead{font:24px Georgia,serif;border:0;background:transparent;color:var(--text);outline:none;width:100%;padding:10px}.saveStatus{font-size:12px;color:#84c99a}.reader{position:fixed;inset:0;background:var(--reader);color:var(--readerText);z-index:30;display:none;flex-direction:column;background-size:cover;background-position:center}.reader.show{display:flex}.readerTop,.readerBottom{padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f2e8d6e8;color:#44372c}.readerTop button,.readerBottom button{color:#44372c;background:#e5d6c1;border-color:#c8b49b}.readerTop .pg{font-size:14px}.bookpage{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:clamp(6px,2vw,22px);position:relative}.spread{width:min(1000px,100%);height:100%;max-height:100%;display:grid;grid-template-columns:1fr 1fr;background:#f7efdf;box-shadow:0 12px 45px #30251a28;border-radius:3px;overflow:hidden;position:relative}.spread:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:linear-gradient(90deg,#e3d4bf,#f9f1e2,#e3d4bf);opacity:.75}.page{padding:clamp(14px,3vw,42px);overflow:auto;min-height:0;font:clamp(15px,1.45vw,20px)/1.85 Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.page h1{font:28px Georgia,serif;text-align:center;margin:12px 0 28px}.page p{margin:0 0 1em;text-indent:1.1em}.page p:first-of-type{text-indent:0}.readerControls{display:flex;gap:10px;align-items:center}.readerProgress{height:4px;background:#cbbba6;flex:1;border-radius:10px;overflow:hidden}.readerProgress div{height:100%;background:#aa8059;width:0}.readerNav{display:flex;gap:6px;align-items:center}.readerNav select{color:#44372c;background:#e5d6c1;border:1px solid #c8b49b;border-radius:8px;padding:7px;max-width:160px}.readerNav label{margin:0;color:#44372c;font-size:11px;white-space:nowrap}.toast{position:fixed;bottom:20px;right:20px;background:#292735;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:50;display:none}.toast.show{display:block}.hidden{display:none!important}.empty{border:1px dashed var(--line);padding:40px;text-align:center;border-radius:14px;color:var(--muted)}.search{max-width:300px}.settingsrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:900px){.sidebar{width:70px;padding:14px 8px}.brand{font-size:0;padding:8px 4px 18px}.brand small{display:none}.nav{justify-content:center;font-size:0}.nav span{font-size:18px}.editor{grid-template-columns:150px 1fr;height:auto}.editor .rightpanel{display:none}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.reader{height:100dvh}.readerTop,.readerBottom{flex-shrink:0}.bookpage{padding:6px}.spread{height:100%;max-height:100%;width:100%;border-radius:0}.page{padding:18px 20px;font-size:clamp(15px,4.2vw,18px);line-height:1.7}.readerBottom{gap:6px}.readerProgress{min-width:30px}.readerBottom button{padding:8px 10px;font-size:13px}.main{padding:16px}.hero{padding:20px}.editor{grid-template-columns:1fr}.editor .chapterpanel{max-height:180px}.editarea{min-height:50vh}.spread{grid-template-columns:1fr;height:85vh}.spread .page:nth-child(2){display:none}.spread:after{display:none}.page{font-size:16px}.readerTop,.readerBottom{padding:10px}.readerTop .pg{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:130px}.book-actions button{flex:1}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand">✦ Vyn<small>NOVEL SPACE · WRITE CREATE DREAM</small></div><button class="nav active" data-view="dashboard"><span>⌂</span> Dashboard</button><button class="nav" data-view="library"><span>▣</span> My Library</button><button class="nav" data-view="studio"><span>✎</span> Writing Studio</button><button class="nav" data-view="history"><span>◷</span> Reading History</button><button class="nav" data-view="stats"><span>▥</span> Statistics</button><button class="nav" data-view="notes"><span>☷</span> Notes</button><button class="nav" data-view="settings"><span>⚙</span> Settings</button><div class="bottom"><button class="nav" id="themeBtn"><span>☾</span> Toggle Theme</button></div></aside><main class="main" id="main"></main></div>
<div class="modalback" id="modal"><div class="modal" id="modalContent"></div></div><div class="toast" id="toast"></div>
<div class="reader" id="reader"><div class="readerTop"><button id="closeReader">✕ Close</button><div class="pg" id="pageLabel">Page 1</div><div class="readerControls"><button id="readerSettings">Aa</button><button id="readerFullscreen">⛶</button></div></div><div class="bookpage"><div class="spread"><div class="page" id="leftPage"></div><div class="page" id="rightPage"></div></div></div><div class="readerBottom"><button id="prevChapter">‹ Chapter</button><button id="prevPage">← Page</button><div class="readerNav"><label>Chapter</label><select id="chapterSelect" aria-label="Navigate chapter"></select><label>Page</label><select id="pageSelect" aria-label="Navigate page"></select></div><div class="readerProgress"><div id="progressFill"></div></div><button id="nextPage">Page →</button><button id="nextChapter">Chapter →</button></div></div>
<script>
const DB_NAME='VynNovelSpaceDB',DB_VERSION=1;let db,novels=[],currentNovel=null,currentChapter=null,admin=false,view='dashboard',readerPages=[],readerIndex=0,themeDark=true;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('novels'))d.createObjectStore('novels',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error);})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function getAll(){return new Promise(res=>{const r=store('novels').getAll();r.onsuccess=()=>res(r.result||[])})}function putNovel(n){return new Promise((res,rej)=>{const r=store('novels','readwrite').put(n);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function setting(key){return new Promise(res=>{const r=store('settings').get(key);r.onsuccess=()=>res(r.result?.value)})}function saveSetting(key,value){store('settings','readwrite').put({key,value})}
const main=document.getElementById('main');function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function words(s=''){return (s.trim().match(/\S+/g)||[]).length}function totalWords(n){return (n.chapters||[]).reduce((a,c)=>a+words(c.content),0)}function allWords(){return novels.reduce((a,n)=>a+totalWords(n),0)}function requireAdmin(action){if(admin){action();return}showModal(`<h2>Admin Access</h2><p class="muted">Masukkan sandi admin untuk mengaktifkan mode editing.</p><label>Admin Password</label><input class="field" type="password" id="adminPass" placeholder="Password"><div class="modalfoot"><button onclick="closeModal()">Cancel</button><button class="primary" id="loginBtn">Unlock</button></div>`);document.getElementById('loginBtn').onclick=async()=>{const pass=document.getElementById('adminPass').value;const saved=await setting('adminPassword')||'admin';if(pass===saved){admin=true;closeModal();toast('Admin Mode aktif');action()}else toast('Password salah')};document.getElementById('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()})}function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function nav(viewName){view=viewName;document.querySelectorAll('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));document.getElementById('themeBtn').onclick=()=>{themeDark=!themeDark;document.body.style.background=themeDark?'#11121a':'#f3eee6';document.body.style.color=themeDark?'#eee9f2':'#2d2a28';toast(themeDark?'Dark theme':'Light theme')};
function render(){if(view==='dashboard')dashboard();else if(view==='library')library();else if(view==='studio')studio();else if(view==='history')historyView();else if(view==='stats')stats();else if(view==='notes')notes();else if(view==='settings')settings()}
function dashboard(){const recent=[...novels].sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,3);main.innerHTML=`<div class="top"><div><div class="eyebrow">YOUR CREATIVE UNIVERSE</div><h1 class="h1">Welcome back, Writer.</h1><div class="muted">Let your imagination flow and create another amazing story.</div></div><button class="primary" onclick="createNovel()">＋ Create New Novel</button></div><section class="hero"><h2 style="font:30px Georgia,serif;margin:0;color:var(--gold2)">Every story begins somewhere.</h2><p>Your ideas deserve a world of their own. Create, write, and revisit every universe you imagine.</p><button class="primary" onclick="nav('library')">Explore My Library →</button></section><div class="stats"><div class="stat"><small>Total Novels</small><b>${novels.length}</b></div><div class="stat"><small>Total Chapters</small><b>${novels.reduce((a,n)=>a+(n.chapters?.length||0),0)}</b></div><div class="stat"><small>Total Words</small><b>${allWords().toLocaleString()}</b></div><div class="stat"><small>Reading Time</small><b>${Math.ceil(allWords()/220)}m</b></div></div><div class="section-title"><h2>Recently Updated</h2><button class="ghost" onclick="nav('library')">View Library →</button></div>${recent.length?`<div class="grid">${recent.map(bookCard).join('')}</div>`:`<div class="empty">Your library is waiting for its first story.<br><br><button class="primary" onclick="createNovel()">Create your first novel</button></div>`}`}
function bookCard(n){return `<div class="card book"><div class="cover" style="${n.cover?'background-image:url('+JSON.stringify(n.cover)+')':''}">${n.cover?'':esc(n.title||'Untitled')}</div><div class="bookbody"><h3>${esc(n.title)}</h3><div class="muted" style="font-size:12px">${esc(n.author||'Unknown Author')} · ${esc(n.genre||'Uncategorized')}</div><p class="muted" style="font-size:12px">${(n.chapters||[]).length} chapters · ${totalWords(n).toLocaleString()} words</p><div class="book-actions"><button onclick="openNovel('${n.id}')">Open</button><button onclick="readNovel('${n.id}')">Read</button><button onclick="editNovel('${n.id}')">Edit</button></div></div></div>`}
function library(){main.innerHTML=`<div class="top"><div><div class="eyebrow">COLLECTION</div><h1 class="h1">My Library</h1><div class="muted">All the worlds you've created.</div></div><button class="primary" onclick="createNovel()">＋ New Novel</button></div><div class="toolbar"><input class="field search" id="libSearch" placeholder="Search novels..."/><select class="field" style="max-width:160px" id="sortBooks"><option value="new">Latest</option><option value="old">Oldest</option><option value="title">Title A-Z</option></select></div><div class="grid" id="bookGrid" style="margin-top:18px"></div>`;fillLibrary()}function fillLibrary(){const q=(document.getElementById('libSearch')?.value||'').toLowerCase(),sort=document.getElementById('sortBooks')?.value||'new';let arr=novels.filter(n=>(n.title+' '+n.genre+' '+n.synopsis).toLowerCase().includes(q));arr.sort(sort==='old'?(a,b)=>(a.created||0)-(b.created||0):sort==='title'?(a,b)=>a.title.localeCompare(b.title):(a,b)=>(b.updated||0)-(a.updated||0));document.getElementById('bookGrid').innerHTML=arr.length?arr.map(bookCard).join(''):`<div class="empty">No novels found.</div>`}function openNovel(id){currentNovel=novels.find(n=>n.id===id);if(!currentNovel)return;view='studio';render();}
function createNovel(){requireAdmin(()=>{showModal(`<h2>Create New Novel</h2><label>Title</label><input class="field" id="newTitle" placeholder="Novel title"><label>Author</label><input class="field" id="newAuthor" placeholder="Author name"><label>Genre</label><input class="field" id="newGenre" placeholder="Fantasy, Romance, etc."><label>Synopsis</label><textarea class="field" id="newSynopsis" rows="3" placeholder="Brief description"></textarea><label>Cover Image</label><input type="file" class="field" id="newCover" accept="image/*"><div class="modalfoot"><button onclick="closeModal()">Cancel</button><button class="primary" id="makeNovel">Create</button></div>`);document.getElementById('makeNovel').onclick=async()=>{const title=document.getElementById('newTitle').value.trim();if(!title){toast('Title wajib diisi');return}let cover=await fileData(document.getElementById('newCover').files[0]);const n={id:crypto.randomUUID(),title,author:document.getElementById('newAuthor').value,genre:document.getElementById('newGenre').value,synopsis:document.getElementById('newSynopsis').value,cover,background:null,created:Date.now(),updated:Date.now(),chapters:[],notes:[]};novels.push(n);await putNovel(n);closeModal();currentNovel=n;view='studio';render();toast('Novel berhasil dibuat')}})}function fileData(file){return new Promise(res=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(file)})}
function editNovel(id){requireAdmin(()=>{const n=novels.find(x=>x.id===id);if(!n)return;showModal(`<h2>Edit Novel</h2><label>Title</label><input class="field" id="etitle" value="${esc(n.title)}"><label>Author</label><input class="field" id="eauthor" value="${esc(n.author||'')}"><label>Genre</label><input class="field" id="egenre" value="${esc(n.genre||'')}"><label>Synopsis</label><textarea class="field" id="esynopsis" rows="4">${esc(n.synopsis||'')}</textarea><label>Replace Cover (optional)</label><input class="field" id="ecover" type="file" accept="image/*"><div class="modalfoot"><button class="ghost" onclick="deleteNovel('${n.id}')">Delete Novel</button><button onclick="closeModal()">Cancel</button><button class="primary" id="saveNovel">Save</button></div>`);document.getElementById('saveNovel').onclick=async()=>{n.title=document.getElementById('etitle').value;n.author=document.getElementById('eauthor').value;n.genre=document.getElementById('egenre').value;n.synopsis=document.getElementById('esynopsis').value;const c=await fileData(document.getElementById('ecover').files[0]);if(c)n.cover=c;n.updated=Date.now();await putNovel(n);closeModal();novels=await getAll();render();toast('Novel updated')}})}async function deleteNovel(id){if(!confirm('Delete this novel and all chapters?'))return;store('novels','readwrite').delete(id);novels=novels.filter(n=>n.id!==id);currentNovel=null;closeModal();render();toast('Novel deleted')}
function studio(){if(currentNovel&&!admin){requireAdmin(()=>render());return}if(!currentNovel){main.innerHTML=`<div class="top"><div><div class="eyebrow">WRITING WORKSPACE</div><h1 class="h1">Writing Studio</h1><div class="muted">Choose a novel to continue writing.</div></div><button class="primary" onclick="createNovel()">＋ Create Novel</button></div><div class="grid">${novels.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><button onclick="openNovel('${n.id}')">Open Studio</button></div>`).join('')}</div>`;return}main.innerHTML=`<div class="top"><div><div class="eyebrow">WRITING STUDIO</div><h1 class="h1">${esc(currentNovel.title)}</h1><div class="muted">${esc(currentNovel.author||'')} · ${currentNovel.chapters.length} chapters</div></div><div class="toolbar"><span id="savedStatus" class="saveStatus">● Saved</span><button onclick="readNovel('${currentNovel.id}')">Read</button><button onclick="nav('library')">Library</button><button class="primary" onclick="newChapter()">＋ Chapter</button></div></div><div class="editor"><div class="editorpanel chapterpanel"><div class="section-title"><h2 style="font-size:17px">Chapters</h2><button onclick="newChapter()">＋</button></div><div id="chapterList">${chaptersList()}</div></div><div class="editorpanel" id="editPanel">${currentChapter?editorMarkup():`<div class="empty">Select a chapter or create a new one.</div>`}</div><div class="editorpanel rightpanel"><h3 style="font:18px Georgia,serif">Chapter Info</h3>${currentChapter?`<p class="muted">Words</p><b id="wordStat">${words(currentChapter.content)}</b><p class="muted">Paragraphs</p><b id="paraStat">${paragraphs(currentChapter.content).length}</b><label>Status</label><select class="field" id="chapterStatus"><option ${currentChapter.status==='Draft'?'selected':''}>Draft</option><option ${currentChapter.status==='Finished'?'selected':''}>Finished</option><option ${currentChapter.status==='Revised'?'selected':''}>Revised</option></select><label>Background</label><input type="file" class="field" id="chapterBg" accept="image/*"><button style="width:100%;margin-top:8px" onclick="uploadChapterBg()">Upload Background</button><button style="width:100%;margin-top:8px" onclick="clearChapterBg()">Clear Background</button>`:`<p class="muted">Chapter settings appear here.</p>`}<hr style="border-color:var(--line)"><button style="width:100%" onclick="uploadNovelBg()">Set Novel Background</button><button style="width:100%;margin-top:8px" onclick="exportNovel('${currentNovel.id}')">Export Novel JSON</button></div></div>`;if(currentChapter){const title=document.getElementById('chapterTitle'),content=document.getElementById('chapterContent');title.oninput=()=>scheduleSave();content.oninput=()=>{updateStats();scheduleSave()};document.getElementById('chapterStatus').onchange=e=>{currentChapter.status=e.target.value;scheduleSave()}}}function paragraphs(text=''){return text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)}function chaptersList(){return currentNovel.chapters.map(c=>`<div class="chapteritem ${currentChapter?.id===c.id?'active':''}" onclick="selectChapter('${c.id}')">${esc(c.title)}</div>`).join('')||'<p class="muted">No chapters yet.</p>'}function editorMarkup(){return `<input class="edithead" id="chapterTitle" value="${esc(currentChapter.title)}" placeholder="Chapter title"><div class="muted" style="padding:0 12px;font-size:12px">${currentChapter.status||'Draft'} · <span id="wordStat">${words(currentChapter.content)}</span> words · <span id="paraStat">${paragraphs(currentChapter.content).length}</span> paragraphs</div><div class="toolbar" style="padding:10px"><button onclick="insertFormat('**','**')">B</button><button onclick="insertFormat('*','*')"><i>I</i></button><button onclick="insertFormat('\n> ','')">Quote</button><button onclick="insertFormat('\n---\n','')">Divider</button><button onclick="insertFormat('\n\n','')">Paragraph</button></div><textarea class="editarea" id="chapterContent" placeholder="Begin your story here...">${esc(currentChapter.content||'')}</textarea>`}function selectChapter(id){currentChapter=currentNovel.chapters.find(c=>c.id===id);render()}function newChapter(){requireAdmin(()=>{if(!currentNovel)return;const c={id:crypto.randomUUID(),title:`Chapter ${currentNovel.chapters.length+1}`,content:'',status:'Draft',created:Date.now(),background:null};currentNovel.chapters.push(c);currentNovel.updated=Date.now();putNovel(currentNovel);currentChapter=c;render();toast('Chapter created')})}let saveTimer;function scheduleSave(){const status=document.getElementById('savedStatus');if(status)status.textContent='● Saving...';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{if(currentChapter){currentChapter.title=document.getElementById('chapterTitle').value;currentChapter.content=document.getElementById('chapterContent').value;currentNovel.updated=Date.now();await putNovel(currentNovel);if(status)status.textContent='● Saved';}},650)}function updateStats(){const c=document.getElementById('chapterContent');if(!c)return;const w=document.getElementById('wordStat'),p=document.getElementById('paraStat');if(w)w.textContent=words(c.value);if(p)p.textContent=paragraphs(c.value).length}function insertFormat(a,b){const el=document.getElementById('chapterContent');if(!el)return;const s=el.selectionStart,e=el.selectionEnd,v=el.value;el.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);el.focus();el.selectionStart=s+a.length;el.selectionEnd=e+a.length;scheduleSave();updateStats()}async function uploadChapterBg(){const f=document.getElementById('chapterBg').files[0];if(!f)return toast('Pilih gambar terlebih dahulu');currentChapter.background=await fileData(f);scheduleSave();toast('Background chapter saved')}async function clearChapterBg(){currentChapter.background=null;await putNovel(currentNovel);toast('Chapter background cleared')}async function uploadNovelBg(){requireAdmin(async()=>{showModal(`<h2>Novel Background</h2><label>Upload background image</label><input class="field" type="file" id="novelBg" accept="image/*"><div class="modalfoot"><button onclick="closeModal()">Cancel</button><button class="primary" id="applyBg">Apply</button></div>`);document.getElementById('applyBg').onclick=async()=>{const f=document.getElementById('novelBg').files[0];if(f)currentNovel.background=await fileData(f);await putNovel(currentNovel);closeModal();toast('Background updated')}})}
function splitPage(text,max=6){const p=paragraphs(text);const pages=[];for(let i=0;i<p.length;i+=max)pages.push(p.slice(i,i+max));return pages.length?pages:[[]]}function splitPageSmart(text,max=6){const paras=paragraphs(text);if(!paras.length)return [[]];const target=document.getElementById('leftPage');const width=Math.max(target.clientWidth,window.innerWidth-40);const height=Math.max(target.clientHeight,window.innerHeight-170);const probe=document.createElement('div');probe.className='page';probe.style.cssText=`position:fixed;left:-10000px;top:0;width:${width}px;height:${height}px;overflow:hidden;visibility:hidden;`;document.body.appendChild(probe);const pages=[];let chunk=[];const heading=readerIndex===0?`<h1>${esc(currentChapter.title)}</h1>`:'';for(const para of paras){if(chunk.length>=max){pages.push(chunk);chunk=[];}chunk.push(para);probe.innerHTML=(pages.length===0?heading:'')+chunk.map(p=>`<p>${esc(p)}</p>`).join('');if(probe.scrollHeight>probe.clientHeight+2&&chunk.length>1){const last=chunk.pop();pages.push(chunk);chunk=[last];probe.innerHTML=chunk.map(p=>`<p>${esc(p)}</p>`).join('');}}if(chunk.length)pages.push(chunk);probe.remove();return pages.length?pages:[[]]}function readNovel(id){currentNovel=novels.find(n=>n.id===id);if(!currentNovel)return;if(!currentNovel.chapters.length){toast('Novel belum memiliki chapter');return}let idx=currentNovel.lastChapter?currentNovel.chapters.findIndex(c=>c.id===currentNovel.lastChapter):0;if(idx<0)idx=0;currentChapter=currentNovel.chapters[idx];readerIndex=currentChapter.lastPage||0;document.getElementById('reader').classList.add('show');buildReader()}function buildReader(){readerPages=splitPageSmart(currentChapter.content,6);readerIndex=Math.min(readerIndex,readerPages.length-1);drawReader()}function moveChapter(dir){if(!currentNovel||!currentChapter)return;const i=currentNovel.chapters.findIndex(c=>c.id===currentChapter.id),next=i+dir;if(next<0||next>=currentNovel.chapters.length)return;currentChapter=currentNovel.chapters[next];readerIndex=0;currentChapter.lastPage=0;currentNovel.lastChapter=currentChapter.id;buildReader();toast('Chapter: '+currentChapter.title)}function drawReader(){const bg=currentChapter.background||currentNovel.background;document.getElementById('reader').style.backgroundImage=bg?`linear-gradient(#f4ead8cc,#f4ead8cc),url('${bg}')`:'';document.getElementById('reader').style.backgroundColor='#f2e8d6';const left=readerPages[readerIndex]||[],right=readerPages[readerIndex+1]||[];const chapterHeading=readerIndex===0?`<h1>${esc(currentChapter.title)}</h1>`:'';document.getElementById('leftPage').innerHTML=chapterHeading+left.map(p=>`<p>${esc(p)}</p>`).join('');document.getElementById('rightPage').innerHTML=right.map(p=>`<p>${esc(p)}</p>`).join('');document.getElementById('pageLabel').textContent=`Page ${readerIndex+1} / ${readerPages.length}`;const ps=document.getElementById('pageSelect');if(ps){ps.innerHTML=readerPages.map((_,i)=>`<option value="${i}">${i+1}</option>`).join('');ps.value=readerIndex;ps.onchange=()=>movePage(Number(ps.value)-readerIndex)}const cs=document.getElementById('chapterSelect');if(cs){cs.innerHTML=currentNovel.chapters.map((c,i)=>`<option value="${i}">${esc(c.title||('Chapter '+(i+1)))}</option>`).join('');cs.value=chapterPosSafe();cs.onchange=()=>jumpChapter(Number(cs.value))}document.getElementById('progressFill').style.width=((readerIndex+1)/readerPages.length*100)+'%';document.getElementById('prevPage').disabled=readerIndex===0;document.getElementById('nextPage').disabled=readerIndex>=readerPages.length-1;const chapterPos=currentNovel.chapters.findIndex(c=>c.id===currentChapter.id);document.getElementById('prevChapter').disabled=chapterPos<=0;document.getElementById('nextChapter').disabled=chapterPos>=currentNovel.chapters.length-1;currentChapter.lastPage=readerIndex;currentNovel.lastChapter=currentChapter.id;putNovel(currentNovel)}function chapterPosSafe(){return currentNovel.chapters.findIndex(c=>c.id===currentChapter.id)}function jumpChapter(index){if(index<0||index>=currentNovel.chapters.length)return;currentChapter=currentNovel.chapters[index];readerIndex=0;currentChapter.lastPage=0;currentNovel.lastChapter=currentChapter.id;buildReader()}function movePage(dir){readerIndex=Math.max(0,Math.min(readerPages.length-1,readerIndex+dir));drawReader()}document.getElementById('prevPage').onclick=()=>movePage(-1);document.getElementById('nextPage').onclick=()=>movePage(1);document.getElementById('prevChapter').onclick=()=>moveChapter(-1);document.getElementById('nextChapter').onclick=()=>moveChapter(1);document.getElementById('closeReader').onclick=()=>document.getElementById('reader').classList.remove('show');document.getElementById('readerSettings').onclick=()=>showModal(`<h2>Reader Settings</h2><label>Paragraphs per page</label><select class="field" id="ppp"><option value="6">6 (Default)</option><option value="4">4</option><option value="8">8</option><option value="10">10</option></select><label>Font size</label><input class="field" type="range" min="14" max="26" value="18" id="readerFont"><div class="modalfoot"><button onclick="closeModal()">Close</button><button class="primary" id="applyReader">Apply</button></div>`);document.getElementById('readerFullscreen').onclick=()=>{const r=document.getElementById('reader');if(!document.fullscreenElement)r.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(document.getElementById('reader').classList.contains('show')){if(e.key==='ArrowRight')movePage(1);if(e.key==='ArrowLeft')movePage(-1);if(e.key==='Escape')document.getElementById('reader').classList.remove('show')}});let touchX=0;document.getElementById('reader').addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});document.getElementById('reader').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>60)movePage(dx<0?1:-1)},{passive:true});document.getElementById('reader').addEventListener('click',e=>{if(e.target.closest('button'))return;const x=e.clientX/window.innerWidth;if(x<.25)movePage(-1);else if(x>.75)movePage(1)});document.getElementById('modalContent').addEventListener('click',e=>{if(e.target.id==='applyReader'){const max=Number(document.getElementById('ppp').value);readerPages=splitPageSmart(currentChapter.content,max);readerIndex=0;document.querySelectorAll('.page').forEach(p=>p.style.fontSize=document.getElementById('readerFont').value+'px');closeModal();drawReader()}});
function exportNovel(id){const n=novels.find(x=>x.id===id);if(!n)return;download(JSON.stringify(n,null,2),`${safeName(n.title)}.json`,'application/json')}function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function safeName(s){return (s||'novel').replace(/[^a-z0-9-_]+/gi,'_')}function historyView(){const list=novels.filter(n=>n.lastChapter);main.innerHTML=`<h1 class="h1">Reading History</h1><p class="muted">Continue where you left off.</p>${list.length?list.map(n=>{const c=n.chapters.find(x=>x.id===n.lastChapter);return `<div class="card" style="margin-bottom:10px"><h3>${esc(n.title)}</h3><p class="muted">${esc(c?.title||'')}</p><button onclick="readNovel('${n.id}')">Continue Reading</button></div>`}).join(''):'<div class="empty">No reading history yet.</div>'}`}function stats(){main.innerHTML=`<div class="eyebrow">YOUR JOURNEY</div><h1 class="h1">Writing Statistics</h1><div class="stats"><div class="stat"><small>Novels</small><b>${novels.length}</b></div><div class="stat"><small>Chapters</small><b>${novels.reduce((a,n)=>a+n.nchapters,0)||novels.reduce((a,n)=>a+(n.chapters?.length||0),0)}</b></div><div class="stat"><small>Total Words</small><b>${allWords().toLocaleString()}</b></div><div class="stat"><small>Est. Reading</small><b>${Math.ceil(allWords()/220)} min</b></div></div><div class="card"><h2>Library overview</h2>${novels.map(n=>`<div class="settingsrow"><span>${esc(n.title)}</span><b>${totalWords(n).toLocaleString()} words</b></div>`).join('')}</div>`}function notes(){main.innerHTML=`<h1 class="h1">Notes & Ideas</h1><p class="muted">Novel notes are stored alongside each book. Open a novel in the studio to add notes in a future update.</p><div class="grid">${novels.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><textarea class="field" rows="6" id="note_${n.id}" placeholder="Ideas, worldbuilding, characters...">${esc(n.notesText||'')}</textarea><button class="primary" style="margin-top:10px" onclick="saveNote('${n.id}')">Save Notes</button></div>`).join('')}</div>`}async function saveNote(id){const n=novels.find(x=>x.id===id);n.notesText=document.getElementById('note_'+id).value;await putNovel(n);toast('Notes saved')}function settings(){main.innerHTML=`<div class="eyebrow">PREFERENCES</div><h1 class="h1">Settings</h1><div class="card"><h2>Admin & Security</h2><p class="muted">Editing requires admin unlock. Default password is admin.</p><button onclick="changePassword()">Change Admin Password</button><button style="margin-left:8px" onclick="admin=false;toast('Admin locked')">Lock Admin Mode</button></div><div class="card" style="margin-top:14px"><h2>Backup & Restore</h2><p class="muted">Download all novels as a JSON backup, or restore from a previous backup file.</p><button class="primary" onclick="backupAll()">Backup Library</button><button style="margin-left:8px" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input type="file" id="restoreFile" class="hidden" accept="application/json" onchange="restoreBackup(this.files[0])"></div><div class="card" style="margin-top:14px"><h2>Storage</h2><div class="settingsrow"><span>Saved novels</span><b>${novels.length}</b></div><div class="settingsrow"><span>Estimated words</span><b>${allWords().toLocaleString()}</b></div><button style="margin-top:12px" onclick="clearLibrary()">Reset Library</button></div>`}function changePassword(){requireAdmin(()=>{showModal(`<h2>Change Admin Password</h2><label>New password</label><input type="password" class="field" id="newAdminPass"><label>Confirm password</label><input type="password" class="field" id="confirmAdminPass"><div class="modalfoot"><button onclick="closeModal()">Cancel</button><button class="primary" id="changePassSave">Save</button></div>`);document.getElementById('changePassSave').onclick=async()=>{const a=document.getElementById('newAdminPass').value,b=document.getElementById('confirmAdminPass').value;if(a.length<3||a!==b)return toast('Password minimal 3 karakter dan harus sama');saveSetting('adminPassword',a);closeModal();toast('Password updated')}})}function backupAll(){download(JSON.stringify({app:'Vyn Novel Space',version:'1.0.3',exportedAt:new Date().toISOString(),novels},null,2),'vyn-novel-space-backup.json','application/json')}async function restoreBackup(file){if(!file)return;try{const data=JSON.parse(await file.text());const arr=Array.isArray(data)?data:data.novels;if(!Array.isArray(arr))throw Error('invalid');for(const n of arr)await putNovel(n);novels=await getAll();render();toast('Backup restored')}catch(e){toast('Backup file tidak valid')}}async function clearLibrary(){if(!confirm('Hapus seluruh library?'))return;if(!confirm('Ini tidak dapat dibatalkan. Yakin?'))return;const tx=db.transaction('novels','readwrite');tx.objectStore('novels').clear();tx.oncomplete=async()=>{novels=[];currentNovel=null;render();toast('Library reset')}}
// Library live filtering hooks
const originalLibrary=library;library=function(){originalLibrary();document.getElementById('libSearch').oninput=fillLibrary;document.getElementById('sortBooks').onchange=fillLibrary};
openDB().then(async()=>{novels=await getAll();novels.sort((a,b)=>(b.updated||0)-(a.updated||0));render()}).catch(()=>main.innerHTML='<div class="empty">Browser storage unavailable. Please use a modern browser with IndexedDB enabled.</div>');
</script></body></html>
