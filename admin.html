<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Panel admin VYN DEVELOPER."><title>Admin Panel — VYN DEVELOPER</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="navbar"><div class="container topline"><a class="brand gradient" href="index.html">VYN DEVELOPER</a><a class="btn btn-outline" href="member-area.html">Area Member</a></div></header>
<main class="container" style="padding-bottom:80px"><section class="section-head"><span class="eyebrow">ADMIN CONTROL</span><h1>Upload <span class="gradient">Plugin.</span></h1><p class="muted">Hanya akun dengan role admin yang dapat mengunggah file.</p></section><section class="auth-card" style="width:100%;max-width:650px"><form id="uploadForm"><div class="field"><label for="nama">Nama plugin</label><input id="nama" required maxlength="80"></div><div class="field"><label for="deskripsi">Deskripsi</label><input id="deskripsi" required maxlength="300"></div><div class="field"><label for="file">File plugin (.jar)</label><input id="file" type="file" accept=".jar,application/java-archive" required></div><div class="progress"><div id="bar"></div></div><p id="status" class="message" role="status"></p><button id="submit" class="btn btn-primary" type="submit">Upload Plugin</button></form></section></main>
<script type="module">
import {auth,db,storage} from "./firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {doc,getDoc,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {ref,uploadBytesResumable} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
let authorized=false;const form=document.querySelector("#uploadForm"),statusEl=document.querySelector("#status"),bar=document.querySelector("#bar"),submit=document.querySelector("#submit");
form.hidden=true;
onAuthStateChanged(auth,async user=>{if(!user){location.replace("login.html");return}try{const snap=await getDoc(doc(db,"members",user.uid));if(!snap.exists()||snap.data().role!=="admin"){statusEl.textContent="Akses ditolak. Akun ini bukan admin.";return}authorized=true;form.hidden=false}catch(e){statusEl.textContent="Gagal memverifikasi role admin. Periksa Firestore Rules."}});
form.addEventListener("submit",async e=>{e.preventDefault();if(!authorized)return;const file=form.file.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith(".jar")){statusEl.textContent="Pilih file berekstensi .jar.";return}if(file.size>100*1024*1024){statusEl.textContent="Ukuran file maksimal 100 MB.";return}
submit.disabled=true;statusEl.textContent="Mengunggah file...";const safe=file.name.replace(/[^a-z0-9._-]/gi,"_");const filePath=`plugins/${Date.now()}_${safe}`;const task=uploadBytesResumable(ref(storage,filePath),file,{contentType:"application/java-archive"});
task.on("state_changed",s=>{bar.style.width=(s.bytesTransferred/s.totalBytes*100)+"%"},err=>{statusEl.textContent="Upload gagal. Periksa Storage Rules.";submit.disabled=false},async()=>{try{await addDoc(collection(db,"plugins"),{nama:form.nama.value.trim(),deskripsi:form.deskripsi.value.trim(),filePath,uploadPada:new Date().toISOString(),createdAt:serverTimestamp()});statusEl.textContent="Plugin berhasil diunggah.";statusEl.className="message success";form.reset();bar.style.width="0%"}catch(err){statusEl.textContent="File terunggah, tetapi metadata gagal disimpan. Periksa Firestore Rules.";console.error(err)}finally{submit.disabled=false}});
});
</script></body></html>
