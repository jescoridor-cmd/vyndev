<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Daftar member VYN DEVELOPER."><title>Daftar Member — VYN DEVELOPER</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-wrap"><section class="auth-card"><a class="brand gradient" href="index.html">VYN DEVELOPER</a><h1>Buat akun member.</h1><p class="muted">Daftar untuk mengakses file download.</p><form id="registerForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password (minimal 6 karakter)</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div><div class="field"><label for="confirm">Konfirmasi password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required></div><p id="message" class="message" role="status"></p><button class="btn btn-primary" style="width:100%" type="submit">Buat Akun</button></form><p class="muted">Sudah punya akun? <a class="gradient" href="login.html">Login</a></p><a class="muted" href="index.html">← Kembali ke website</a></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {createUserWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const form=document.querySelector("#registerForm"),msg=document.querySelector("#message");
onAuthStateChanged(auth,user=>{if(user)location.replace("member-area.html")});
form.addEventListener("submit",async e=>{e.preventDefault();msg.className="message";if(form.password.value!==form.confirm.value){msg.textContent="Konfirmasi password tidak sama.";return}if(form.password.value.length<6){msg.textContent="Password minimal 6 karakter.";return}
msg.textContent="Membuat akun...";try{const cred=await createUserWithEmailAndPassword(auth,form.email.value.trim(),form.password.value);await setDoc(doc(db,"members",cred.user.uid),{email:cred.user.email,daftarPada:new Date().toISOString(),createdAt:serverTimestamp(),role:"member"});location.href="member-area.html"}catch(err){const map={"auth/email-already-in-use":"Email sudah terdaftar.","auth/invalid-email":"Format email tidak valid.","auth/weak-password":"Password terlalu lemah."};msg.textContent=map[err.code]||"Pendaftaran gagal. Periksa konfigurasi Firebase."}});
</script></body></html>
