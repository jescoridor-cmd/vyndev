<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Area download member VYN DEVELOPER."><title>Member Area — VYN DEVELOPER</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="navbar"><div class="container topline"><a class="brand gradient" href="index.html">VYN DEVELOPER</a><div><span id="userEmail" class="muted"></span> <button id="logout" class="btn btn-outline">Logout</button></div></div></header>
<main class="container"><div class="section-head"><span class="eyebrow">MEMBER ACCESS</span><h1>Plugin <span class="gradient">Download.</span></h1><p class="muted">Pilih file yang tersedia di bawah ini. Akses download memerlukan sesi login yang valid.</p></div><p id="status" class="muted">Memuat daftar plugin...</p><div id="plugins" class="plugin-list"></div></main>
<script type="module">
import {auth,db,storage} from "./firebase-config.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {collection,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {ref,getBlob} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
const statusEl=document.querySelector("#status"),list=document.querySelector("#plugins");
document.querySelector("#logout").addEventListener("click",async()=>{await signOut(auth);location.href="login.html"});
onAuthStateChanged(auth,async user=>{if(!user){location.replace("login.html");return}document.querySelector("#userEmail").textContent=user.email;await loadPlugins()});
async function loadPlugins(){try{const snap=await getDocs(query(collection(db,"plugins"),orderBy("uploadPada","desc")));list.innerHTML="";if(snap.empty){statusEl.textContent="Belum ada plugin yang tersedia.";return}statusEl.textContent="";snap.forEach(d=>{const p=d.data(),card=document.createElement("article");card.className="glass plugin-card";const title=document.createElement("h3");title.textContent=p.nama||"Plugin";const desc=document.createElement("p");desc.className="muted";desc.textContent=p.deskripsi||"Tidak ada deskripsi.";const date=document.createElement("small");date.className="muted";date.textContent=p.uploadPada?new Date(p.uploadPada).toLocaleDateString("id-ID"):"";const btn=document.createElement("button");btn.className="btn btn-primary";btn.textContent="Download .jar";btn.addEventListener("click",()=>downloadPlugin(p,btn));card.append(title,desc,date,document.createElement("br"),btn);list.append(card)})}catch(e){statusEl.textContent="Gagal memuat plugin. Periksa Firestore Rules dan koneksi Firebase."}}
async function downloadPlugin(plugin,button){if(!plugin.filePath)return alert("Path file tidak ditemukan.");button.disabled=true;button.textContent="Menyiapkan...";try{const blob=await getBlob(ref(storage,plugin.filePath));const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=(plugin.nama||"plugin").replace(/[^a-z0-9-_]/gi,"_")+".jar";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert("Download gagal. Pastikan Anda login dan file masih tersedia di Storage.");console.error(e)}finally{button.disabled=false;button.textContent="Download .jar"}}
</script></body></html>
